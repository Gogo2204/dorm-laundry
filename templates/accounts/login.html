{% extends "base.html" %}
{% load static %}

{% block title %}Вход — Пералня{% endblock %}

{% block content %}
<div class="plate poster">
    <div class="poster-art halftone">
        <span class="label">Общежитие</span>
        <img src="{% static 'img/washer.svg' %}" alt="" width="200" height="240">
        <p class="display">Перете<br>по график</p>
    </div>
    <div class="poster-form">
        <h1>Вход</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include "includes/form.html" %}
            <button type="submit" class="btn btn-primary btn-block">Влез</button>
        </form>
        <div class="links small">
            <a href="{% url 'password_reset' %}">Забравена парола?</a>
            <a href="{% url 'register' %}">Регистрация</a>
        </div>
    </div>
</div>
{% endblock %}
