name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks-and-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # The test client speaks plain HTTP; keep the rest of the production
      # settings path active but skip the HTTPS redirect.
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Django system checks
        run: python manage.py check

      - name: Verify migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2
