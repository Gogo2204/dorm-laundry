name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks-and-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # The test client speaks plain HTTP; keep the rest of the production
      # settings path active but skip the HTTPS redirect.
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Django system checks
        run: python manage.py check

      - name: Verify migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

  tests-postgresql:
    # Runs the full suite — including the true concurrency tests that are
    # skipped on SQLite — against a disposable PostgreSQL database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dorm_laundry
          POSTGRES_PASSWORD: ci-only-db-password
          POSTGRES_DB: dorm_laundry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dorm_laundry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DB_ENGINE: postgresql
      POSTGRES_DB: dorm_laundry
      POSTGRES_USER: dorm_laundry
      POSTGRES_PASSWORD: ci-only-db-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt psycopg[binary]

      - name: Fail loudly if the database is not actually PostgreSQL
        # Guards against a misconfiguration making the concurrency tests
        # silently skip while this job stays green.
        run: |
          python manage.py shell -c "from django.db import connection; assert connection.vendor == 'postgresql', f'expected postgresql, got {connection.vendor}'"

      - name: Run tests against PostgreSQL (concurrency tests must not skip)
        run: |
          python manage.py test --verbosity 2 2>&1 | tee test-output.log
          ! grep -q "skipped on SQLite" test-output.log
