# Nginx site for Dorm Laundry.
# Install as /etc/nginx/sites-available/dorm-laundry and symlink into
# sites-enabled. Always test before reloading:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Placeholders: <DOMAIN> (e.g. laundry.example.com) and <APP_DIR>.
#
# Certificate bootstrap: start with ONLY the port-80 server block active
# (comment the 443 block out), obtain the certificate with
#   sudo certbot --nginx -d <DOMAIN>
# (certbot rewrites this file to add TLS and the HTTP->HTTPS redirect),
# then verify with: sudo certbot renew --dry-run

# Generous per-IP rate limits for the sensitive endpoints. Many residents
# share the dormitory NAT IP, so the rates are deliberately high — they stop
# scripted brute force, not people. 30 req/min/IP with burst 15 means a whole
# corridor logging in at once still gets through.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_status 429;

upstream dorm_laundry {
    server unix:/run/dorm-laundry/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    # Let's Encrypt HTTP-01 challenges are always served directly, so
    # certificate issuance and renewal work regardless of redirects.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # After certbot runs it adds: return 301 https://$host$request_uri;

    client_max_body_size 2m;  # largest upload is a small CSV file

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias <APP_DIR>/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Brute-force-sensitive endpoints get the rate limit.
    location ~ ^/(accounts/login/|accounts/password-reset/|accounts/account/pin/reveal/|admin/login/) {
        limit_req zone=auth burst=15 nodelay;
        proxy_pass http://dorm_laundry;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://dorm_laundry;
        include /etc/nginx/proxy_params;
        # Django's SECURE_PROXY_SSL_HEADER trusts this header — Nginx must
        # always set it itself and never forward a client-supplied value.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# The HTTPS server block is created by certbot. After it exists, confirm:
#   - listen 443 ssl; with the Let's Encrypt certificate paths
#   - the same location blocks as above (certbot copies them)
#   - HTTP requests redirect to HTTPS
# Only then raise DJANGO_HSTS_SECONDS from 0 back to its default.
